---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/rsync -av --exclude='.git' --exclude='.cpanel.yml' --exclude='.htaccess*' --exclude='php.ini' --exclude='.well-known' --exclude='cgi-bin' ./ $DEPLOYPATH
    - cat $HOME/.htaccess.default ./.htaccess.custom > $DEPLOYPATH/.htaccess
